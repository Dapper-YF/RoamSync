[project]
name = "roamsync-backend"
version = "0.1.0"
description = "RoamSync FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "openai>=2.0,<3",
    "opencc-python-reimplemented==0.1.7",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
